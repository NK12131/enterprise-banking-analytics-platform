# =============================================================================
# Enterprise Banking Analytics Platform
# Dataset Configuration
# =============================================================================

project:

  name: Enterprise Banking Analytics Platform

  environment: dev

  random_seed: 42

# =============================================================================
# Date Range
# =============================================================================

date_range:

  start_date: "2025-01-01"

  end_date: "2026-12-31"

# =============================================================================
# Output Directory
# =============================================================================

output:

  base_directory: data/raw

  archive_directory: data/archive

# =============================================================================
# Customers
# =============================================================================

customers:

  records: 100000

  format: json

  partition_size: 5000

# =============================================================================
# Accounts
# =============================================================================

accounts:

  records: 250000

  format: parquet

  partition_size: 100000

# =============================================================================
# Transactions
# =============================================================================

transactions:

  records_per_account:

    minimum: 20

    maximum: 80

  format: parquet

  partition_size: 250000

# =============================================================================
# Loans
# =============================================================================

loans:

  customer_probability: 0.20

  format: json

  partition_size: 5000

# =============================================================================
# Credit Cards
# =============================================================================

credit_cards:

  customer_probability: 0.40

  maximum_cards_per_customer: 2

  format: parquet

  partition_size: 50000

# =============================================================================
# Fraud
# =============================================================================

fraud:

  fraud_rate: 0.003

  format: json

  partition_size: 5000


branches:

  records: 500

  format: csv

  partition_size: 500

employees:

  records: 8000

  format: csv

exchange_rates:

  records: 25

  format: csv

# =============================================================================
# Logging
# =============================================================================

logging:

  level: INFO

  log_directory: logs

# =============================================================================
# Data Generation
# =============================================================================

generation:

  timezone: UTC

  batch_size: 10000